name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CMake: all platforms, compilers, build types, portable toggle ────────────
  cmake:
    name: cmake / ${{ matrix.os }} ${{ matrix.label }} ${{ matrix.build_type }}
      portable=${{ matrix.portable }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — GCC
          - {
              os: ubuntu-latest,
              label: gcc,
              cc: gcc,
              cxx: g++,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: ubuntu-latest,
              label: gcc,
              cc: gcc,
              cxx: g++,
              build_type: Release,
              portable: ON,
            }
          - {
              os: ubuntu-latest,
              label: gcc,
              cc: gcc,
              cxx: g++,
              build_type: Debug,
              portable: OFF,
            }
          # Linux — Clang
          - {
              os: ubuntu-latest,
              label: clang,
              cc: clang,
              cxx: clang++,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: ubuntu-latest,
              label: clang,
              cc: clang,
              cxx: clang++,
              build_type: Release,
              portable: ON,
            }
          - {
              os: ubuntu-latest,
              label: clang,
              cc: clang,
              cxx: clang++,
              build_type: Debug,
              portable: OFF,
            }
          # macOS — AppleClang (platform default; Debug×Portable=ON omitted — same flags as OFF)
          - {
              os: macos-latest,
              label: appleclang,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: macos-latest,
              label: appleclang,
              build_type: Release,
              portable: ON,
            }
          - {
              os: macos-latest,
              label: appleclang,
              build_type: Debug,
              portable: OFF,
            }
          # Windows — MSVC (multi-config VS generator; CMAKE_BUILD_TYPE ignored at configure time)
          - {
              os: windows-latest,
              label: msvc,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: windows-latest,
              label: msvc,
              build_type: Release,
              portable: ON,
            }
          - {
              os: windows-latest,
              label: msvc,
              build_type: Debug,
              portable: OFF,
            }

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRASTERMINAL_PORTABLE=${{ matrix.portable }} ${{ matrix.cc  &&
          format('-DCMAKE_C_COMPILER={0}',   matrix.cc)  || '' }} ${{ matrix.cxx
          && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  # ── Make: Linux + macOS, GCC + Clang, all four targets ──────────────────────
  make:
    name: make / ${{ matrix.os }} ${{ matrix.cxx }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — GCC
          - { os: ubuntu-latest, cxx: g++, target: release }
          - { os: ubuntu-latest, cxx: g++, target: portable }
          - { os: ubuntu-latest, cxx: g++, target: debug }
          - { os: ubuntu-latest, cxx: g++, target: test }
          # Linux — Clang
          - { os: ubuntu-latest, cxx: clang++, target: release }
          - { os: ubuntu-latest, cxx: clang++, target: portable }
          - { os: ubuntu-latest, cxx: clang++, target: debug }
          - { os: ubuntu-latest, cxx: clang++, target: test }
          # macOS — AppleClang (explicit clang++ avoids g++→clang symlink ambiguity)
          - { os: macos-latest, cxx: clang++, target: release }
          - { os: macos-latest, cxx: clang++, target: portable }
          - { os: macos-latest, cxx: clang++, target: debug }
          - { os: macos-latest, cxx: clang++, target: test }

    steps:
      - uses: actions/checkout@v6

      - name: Build${{ matrix.target == 'test' && ' and test' || '' }}
        run: make CXX=${{ matrix.cxx }} ${{ matrix.target }}

  # ── clang-format (Linux) ─────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run clang-format
        run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp tests/*.h

  # ── clang-tidy (Linux Clang, CMake Debug with compile_commands.json) ────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: >
          clang-tidy
          --warnings-as-errors='*'
          -p build
          --header-filter='src/.*'
          src/main.cpp src/args.cpp src/framebuffer.cpp src/mesh.cpp
          src/mesh_obj.cpp src/mesh_ply.cpp src/mesh_stl.cpp src/mesh_gltf.cpp
          src/camera.cpp src/shadow.cpp src/rasterize.cpp src/renderer.cpp
          src/texture.cpp

  # ── cppcheck (Linux) ──────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck --enable=all --std=c++17 --error-exitcode=1
          --suppress=missingIncludeSystem
          --suppressions-list=cppcheck-suppressions.txt
          -I src/
          -I vendor/cgltf
          -I vendor/stb
          -I vendor/stl_reader
          -I vendor/tinyobjloader
          -I vendor/tinyply
          src/*.cpp

  # ── Sanitizers: ASan+UBSan and TSan (Linux Clang, CMake Debug) ───────────
  sanitizers:
    name: sanitizer / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: asan-ubsan
            san_flags:
              -fsanitize=address,undefined -fno-sanitize-recover=undefined
              -fno-omit-frame-pointer
            asan_options: detect_leaks=1:halt_on_error=1:abort_on_error=1
            ubsan_options: halt_on_error=1:print_stacktrace=1
          - label: tsan
            san_flags: -fsanitize=thread -fno-omit-frame-pointer
            tsan_options: halt_on_error=1:second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: ${{ matrix.san_flags }}
          LDFLAGS: ${{ matrix.san_flags }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug -j

      - name: Download models
        run: |
          mkdir -p bench
          BASE_KHRONOS="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Duck"
          BASE_BUNNY="https://raw.githubusercontent.com/reprap-io/reprapio_stanford_bunny/master"
          curl -fsSL "$BASE_KHRONOS/glTF-Binary/Duck.glb" -o bench/Duck.glb
          curl -fsSL "$BASE_BUNNY/bunny.stl"              -o bench/Stanford_Bunny.stl

      - name: Test
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Bench (full-pipeline sanitizer coverage)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: |
          ./build/rasterminal --bench 500 --bench-warmup 50 bench/Duck.glb
          ./build/rasterminal --bench 500 --bench-warmup 50 bench/Stanford_Bunny.stl
