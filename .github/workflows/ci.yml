name: CI

on:
  # Branch pushes and PRs only; tag pushes are handled by release.yml (a `branches`
  # filter excludes tags), so a release tag does not also trigger the full CI matrix.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build + test: all platforms, compilers, build types, portable toggle ─────
  build:
    name: ${{ matrix.os }} ${{ matrix.label }} ${{ matrix.build_type }}
      portable=${{ matrix.portable }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, GCC
          - {
              os: ubuntu-latest,
              label: gcc,
              cc: gcc,
              cxx: g++,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: ubuntu-latest,
              label: gcc,
              cc: gcc,
              cxx: g++,
              build_type: Release,
              portable: ON,
            }
          - {
              os: ubuntu-latest,
              label: gcc,
              cc: gcc,
              cxx: g++,
              build_type: Debug,
              portable: OFF,
            }
          # Linux, Clang
          - {
              os: ubuntu-latest,
              label: clang,
              cc: clang,
              cxx: clang++,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: ubuntu-latest,
              label: clang,
              cc: clang,
              cxx: clang++,
              build_type: Release,
              portable: ON,
            }
          - {
              os: ubuntu-latest,
              label: clang,
              cc: clang,
              cxx: clang++,
              build_type: Debug,
              portable: OFF,
            }
          # Linux, dist (portable codegen + static libstdc++/libgcc; the release artifact).
          # Linux-only: static-libstdc++ is a no-op on macOS and unsupported on MSVC. The
          # extra "Verify static link" step below asserts the binary's defining invariant.
          - {
              os: ubuntu-latest,
              label: gcc dist,
              cc: gcc,
              cxx: g++,
              build_type: Release,
              portable: ON,
              static_libstdcxx: ON,
            }
          - {
              os: ubuntu-latest,
              label: clang dist,
              cc: clang,
              cxx: clang++,
              build_type: Release,
              portable: ON,
              static_libstdcxx: ON,
            }
          # Only CMAKE_CXX_COMPILER set, so C falls back to `cc` (gcc here). Before the
          # vendored C sources moved to their own no-LTO object library this combination
          # produced GIMPLE C objects that a clang link could not read. `cc` is left out of
          # the matrix entry on purpose: the configure step omits the flag when it is unset.
          - {
              os: ubuntu-latest,
              label: clang++ only,
              cxx: clang++,
              build_type: Release,
              portable: ON,
            }
          # macOS, AppleClang (platform default; Debug x Portable=ON omitted, same flags as OFF)
          - {
              os: macos-latest,
              label: appleclang,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: macos-latest,
              label: appleclang,
              build_type: Release,
              portable: ON,
            }
          - {
              os: macos-latest,
              label: appleclang,
              build_type: Debug,
              portable: OFF,
            }
          # Windows, MSVC (multi-config VS generator; CMAKE_BUILD_TYPE ignored at configure time)
          - {
              os: windows-latest,
              label: msvc,
              build_type: Release,
              portable: OFF,
            }
          - {
              os: windows-latest,
              label: msvc,
              build_type: Release,
              portable: ON,
            }
          - {
              os: windows-latest,
              label: msvc,
              build_type: Debug,
              portable: OFF,
            }

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRASTERMINAL_PORTABLE=${{ matrix.portable }}
          -DRASTERMINAL_STATIC_LIBSTDCXX=${{ matrix.static_libstdcxx || 'OFF' }}
          ${{ matrix.cc  && format('-DCMAKE_C_COMPILER={0}',   matrix.cc)  || '' }} ${{ matrix.cxx
          && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}

      # Both targets by name: rasterminal_tests is EXCLUDE_FROM_ALL, so a plain
      # `cmake --build` builds the viewer alone and ctest would find no binary.
      # Bare -j launches every Assimp TU at once. Cap the build for small macOS runners.
      - name: Build
        run: >
          cmake --build build --config ${{ matrix.build_type }} -j4
          --target rasterminal rasterminal_tests

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      # dist's defining invariant: the binary must not pull in libstdc++/libgcc at runtime.
      - name: Verify static link (dist)
        if: matrix.static_libstdcxx == 'ON'
        run: |
          ldd build/rasterminal
          ! ldd build/rasterminal | grep -E 'libstdc\+\+|libgcc_s'

      # The same smoke test and packaging release.yml runs, which a tag push is otherwise the
      # only way to exercise. Deliberately duplicated rather than shared: if the two drift,
      # this is what notices, on a normal push instead of on a release.
      - name: Smoke test and package (dist)
        if: matrix.static_libstdcxx == 'ON'
        run: |
          set -euo pipefail
          ./build/rasterminal --version
          ./build/rasterminal --help
          printf 'v -1 -1 -1\nv 1 -1 -1\nv 1 1 -1\nf 1 2 3\n' > tri.obj
          ./build/rasterminal --bench 5 --bench-warmup 1 tri.obj
          stage=rasterminal-ci-linux-x86_64
          mkdir "$stage"
          cp build/rasterminal LICENSE THIRD_PARTY_NOTICES README.md "$stage"/
          tar czf "$stage.tar.gz" "$stage"
          tar tzf "$stage.tar.gz"
          test "$(tar tzf "$stage.tar.gz" | grep -c '[^/]$')" -eq 4

  # ── 32-bit (ILP32) verification ──────────────────────────────────────────────
  # No 32-bit OS runner exists, but 32-bit binaries run natively on the 64-bit runners
  # (Linux multilib / Windows WOW64), so we build and test 32-bit in place. Linux i686 uses
  # -m32 + gcc/g++-multilib; the build system auto-pins SSE math (the i686 x87 default would
  # diverge from the SSE/x86-64 results the renderer and tests assume) and relaxes the
  # word-size-dependent -Wuseless-cast on ILP32. Windows uses the MSVC Win32 toolchain via
  # -A Win32 (SSE2 is its default; no extra flags).
  cross32:
    name: 32-bit / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux i686 gcc, kind: linux, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, name: linux i686 clang, kind: linux, cc: clang, cxx: clang++ }
          - { os: windows-latest, name: windows Win32 msvc, kind: win32 }

    steps:
      - uses: actions/checkout@v6

      - name: Install 32-bit toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # -m32 via env (mirrors the sanitizer jobs) + portable codegen (drops
      # -march=native). The build system adds -msse2 and drops -Wuseless-cast on ILP32.
      - name: Build + ctest (i686)
        if: matrix.kind == 'linux'
        env:
          CXXFLAGS: -m32
          CFLAGS: -m32
          LDFLAGS: -m32
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DRASTERMINAL_PORTABLE=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build -j"$(nproc)" --target rasterminal rasterminal_tests
          ctest --test-dir build --output-on-failure

      # MSVC multi-config VS generator; -A Win32 selects the 32-bit toolchain. Always pass
      # --config/-C (the generator ignores CMAKE_BUILD_TYPE at configure time).
      - name: Build + ctest (Win32)
        if: matrix.kind == 'win32'
        run: |
          cmake -B build -A Win32
          cmake --build build --config Release -j --target rasterminal rasterminal_tests
          ctest --test-dir build -C Release --output-on-failure

  # ── Documented workflows (Linux) ─────────────────────────────────────────────
  # Every step here is a sequence README.md or CONTRIBUTING.md tells a user to run, or a
  # target nothing else exercises. Both of the first two were broken at some point by a
  # change that looked local: the preset flow by making the test binary EXCLUDE_FROM_ALL,
  # and the uninstall docdir by an install-time --prefix. One build serves all of them.
  workflows:
    name: documented workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Every configure preset needs a build preset that names the test binary and a test
      # preset to run it, or `cmake --build --preset X && ctest --preset X` dies with
      # "Not Run" the way release did before fe7a39e. Structural, so it covers all six
      # without paying for six builds; the step below actually runs one of them.
      - name: Presets are complete
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("CMakePresets.json"))
          want = ["rasterminal", "rasterminal_tests"]
          cfg = {c["name"] for c in d["configurePresets"]}
          bad = []
          for name in sorted(cfg):
              b = next((x for x in d["buildPresets"] if x["name"] == name), None)
              t = next((x for x in d["testPresets"] if x["name"] == name), None)
              if b is None:
                  bad.append(f"{name}: no build preset")
              elif b.get("targets") != want:
                  bad.append(f"{name}: build preset does not name {want}")
              if t is None:
                  bad.append(f"{name}: no test preset")
          for line in bad:
              print("ERROR:", line)
          sys.exit(1 if bad else 0)
          EOF

      # Verbatim from the README. `ctest --preset` needs the test binary, which is
      # EXCLUDE_FROM_ALL, so the build preset has to name it.
      - name: Preset flow
        run: |
          cmake --preset release
          cmake --build --preset release -j"$(nproc)"
          ctest --preset release

      # The one-command build-and-run CONTRIBUTING.md documents.
      - name: check target
        run: cmake --build build --target check -j"$(nproc)"

      # The quick start ends in ./build/rasterminal, so that path has to exist.
      - name: Quick-start binary path
        run: test -x build/rasterminal

      # Staged install for packagers: the files, their modes, then a clean uninstall that
      # leaves the shared directories alone and takes its own docdir with it.
      - name: Install and uninstall (DESTDIR)
        run: |
          set -euo pipefail
          DESTDIR="$PWD/stage" cmake --install build
          test "$(find stage -type f | wc -l)" -eq 5
          test "$(stat -c %a stage/usr/local/bin/rasterminal)" = 755
          test "$(stat -c %a stage/usr/local/share/man/man1/rasterminal.1)" = 644
          test "$(stat -c %a stage/usr/local/share/doc/rasterminal/LICENSE)" = 644
          DESTDIR="$PWD/stage" cmake --build build --target uninstall
          test -z "$(find stage -type f)"
          test ! -d stage/usr/local/share/doc/rasterminal
          test -d stage/usr/local/share/man/man1

      # An install-time --prefix, which the README documents. The docdir cleanup has to
      # follow the prefix actually installed to, not whatever configure happened to see.
      - name: Install and uninstall (--prefix)
        run: |
          set -euo pipefail
          cmake --install build --prefix "$PWD/pfx"
          test -x pfx/bin/rasterminal
          cmake --build build --target uninstall
          test -z "$(find pfx -type f)"
          test ! -d pfx/share/doc/rasterminal

      # A docdir holding anything we did not install is not ours to delete.
      - name: Uninstall leaves a shared docdir alone
        run: |
          set -euo pipefail
          cmake --install build --prefix "$PWD/pfx2"
          touch pfx2/share/doc/rasterminal/NOTES.txt
          cmake --build build --target uninstall
          test -f pfx2/share/doc/rasterminal/NOTES.txt

      # Uninstalling where nothing was installed must fail loud, never quietly succeed.
      - name: Uninstall without a manifest fails
        run: |
          cmake -B build-empty -DCMAKE_BUILD_TYPE=Release
          if cmake --build build-empty --target uninstall; then
            echo "ERROR: uninstall succeeded with no install_manifest.txt"
            exit 1
          fi

  # ── clang-format (Linux) ─────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run clang-format
        run: >
          find src tests \( -name '*.cpp' -o -name '*.h' \)
          | xargs -r clang-format --dry-run --Werror

  # ── clang-tidy (Linux Clang, CMake Debug with compile_commands.json) ────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Install clang-tidy-22
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y clang-tidy-22

      # clang-tidy has no -j; fan the file list across cores with xargs -P (each
      # invocation re-parses one TU, so this scales near-linearly). All src TUs are
      # linted, including the ktx2/webp vendor-header isolation wrappers, which pass
      # under the clang-analyzer suppressions already in .clang-tidy. A file failing
      # under --warnings-as-errors makes xargs exit non-zero (123). `find`, never a
      # src/*.cpp glob: a glob silently skips the subdirectories and still reports green.
      - name: Run clang-tidy (src)
        run: >
          find src -name '*.cpp'
          | xargs -r -P "$(nproc)" -n1
          clang-tidy-22 --warnings-as-errors='*' -p build --header-filter='src/.*'

      - name: Run clang-tidy (tests)
        run: >
          find tests -name '*.cpp'
          | xargs -r -P "$(nproc)" -n1
          clang-tidy-22 --warnings-as-errors='*' -p build --header-filter='(src|tests)/.*'

  # ── cppcheck (Linux) ──────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck --enable=all --std=c++17 --check-level=normal --error-exitcode=1
          --inline-suppr
          --suppress=missingIncludeSystem
          --suppressions-list=cppcheck-suppressions.txt
          -I .
          -I tooling/assimp-config
          -I vendor/assimp/include
          -I vendor/cgltf
          -I vendor/meshoptimizer/src
          -I vendor/stb
          -I vendor/stl_reader
          -I vendor/tinyobjloader
          -I vendor/tinyply
          -I vendor/draco/src
          -I vendor/basisu/transcoder
          -I vendor/basisu/zstd
          -I vendor/libwebp
          -I vendor/miniz
          $(find src -name '*.cpp')

  # ── Sanitizers: ASan+UBSan and TSan (Linux Clang, CMake Debug) ───────────
  sanitizers:
    name: sanitizer / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: asan-ubsan
            san_flags:
              -fsanitize=address,undefined -fno-sanitize-recover=undefined
              -fno-omit-frame-pointer
            asan_options: detect_leaks=1:halt_on_error=1:abort_on_error=1
            ubsan_options: halt_on_error=1:print_stacktrace=1
          - label: tsan
            san_flags: -fsanitize=thread -fno-omit-frame-pointer
            tsan_options: halt_on_error=1:second_deadlock_stack=1

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: ${{ matrix.san_flags }}
          LDFLAGS: ${{ matrix.san_flags }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug -j"$(nproc)" --target rasterminal rasterminal_tests

      - name: Download models
        run: |
          mkdir -p bench
          BASE_KHRONOS="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Duck"
          BASE_BUNNY="https://raw.githubusercontent.com/reprap-io/reprapio_stanford_bunny/master"
          curl -fsSL "$BASE_KHRONOS/glTF-Binary/Duck.glb" -o bench/Duck.glb
          curl -fsSL "$BASE_BUNNY/bunny.stl"              -o bench/Stanford_Bunny.stl

      - name: Test
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Bench (full-pipeline sanitizer coverage)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
          TSAN_OPTIONS: ${{ matrix.tsan_options }}
        run: |
          ./build/rasterminal --bench 500 --bench-warmup 50 bench/Duck.glb
          ./build/rasterminal --bench 500 --bench-warmup 50 bench/Stanford_Bunny.stl
          # The runs above are small frames of small meshes, so they only ever take the immediate
          # opaque pass. Duck at 1080p has the big triangles the predictor picks tiles for; the
          # frame count is low because a sanitized 1080p frame costs ~100x a 200x120 one.
          ./build/rasterminal --bench 30 --bench-warmup 5 --bench-size 1920x1080 bench/Duck.glb
