name: Bug report
description: Something renders wrong, crashes, or misbehaves
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command and any keys or mouse actions needed to trigger it.
      placeholder: |
        1. rasterminal --shading phong model.glb
        2. Press Space
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rasterminal version
      description: Paste `rasterminal --version`. For source builds, also paste `git rev-parse --short HEAD`.
      placeholder: rasterminal 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Prebuilt release binary
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 / macOS 15 / Windows 11
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Include the terminal name and version, tmux or screen if used, and `echo $TERM $COLORTERM` on Linux or macOS.
      placeholder: kitty 0.35 (xterm-kitty, truecolor), tmux 3.4
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model file
      description: For model-specific bugs, name the format and whether it is native or Assimp-backed. Link or attach a reproducing file if possible.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Add screenshots, recordings or workarounds.
    validations:
      required: false
