name: Bug report
description: Something renders wrong, crashes, or misbehaves
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug. If it is not obvious, also say what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command line, plus any keys or mouse actions needed to trigger the bug.
      placeholder: |
        1. rasterminal --shading phong model.glb
        2. Press Space
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rasterminal version
      description: Output of `rasterminal --version`. If built from source, also the commit hash (`git rev-parse --short HEAD`).
      placeholder: rasterminal 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - Prebuilt release binary
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04 / macOS 15 / Windows 11
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Terminal emulator and version, plus tmux or screen if you use one. On Linux/macOS, include the output of `echo $TERM $COLORTERM`.
      placeholder: kitty 0.35 (xterm-kitty, truecolor), tmux 3.4
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model file
      description: If the bug involves a specific model, name the format and whether README lists it as native or Assimp-backed. If possible, add a link to or attachment of a file that reproduces it.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, recordings, workarounds you found.
    validations:
      required: false
